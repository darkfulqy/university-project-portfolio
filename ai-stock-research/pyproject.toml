[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-discovery"
version = "0.1.0"
description = "MVP research assistant for traceable AI-related US equity discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-stock-discovery = "ai_stock_discovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
