# Minimal project-only configuration. No machine-wide settings are changed.
[sdl]
fullscreen=false
windowresolution=1120x700
output=surface
autolock=false

[dosbox]
machine=vgaonly
memsize=16

[cpu]
core=normal
cputype=8086
cycles=fixed 5000

[render]
frameskip=0
aspect=true
scaler=normal2x

[mixer]
nosound=true

[dos]
keyboardlayout=us

[autoexec]
@echo off
