[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "maijishan-backend"
version = "0.1.0"
description = "Maijishan backend"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "sqlalchemy>=2.0.0",
  "pymysql>=1.1.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "email-validator>=2.1.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "requests>=2.31.0",
  "openai>=1.0.0",
  "qdrant-client>=1.7.0",
  "rank-bm25>=0.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
