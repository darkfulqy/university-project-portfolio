sota_library_summary: |-
  {% import "scenarios.crypto.prompts:crypto_eval_macros" as em %}
  {% if library %}
  Accepted factor library (SOTA, {{ library | length }} factor(s)). These factors are already part of the composite in every round; do NOT re-implement them or propose near-duplicates (gate R3 rejects |corr| >= gate_max_corr with any of them). Metrics are on the valid segment at the primary horizon {{ primary_horizon_key }}.
  | name | ic_mean | ic_ir | ic_tstat | rank_autocorr_1 |
  |------|---------|-------|----------|-----------------|
  {% for row in library -%}
  | {{ row.get("name") }} | {{ em.num(row.get("ic_mean")) }} | {{ em.num(row.get("ic_ir")) }} | {{ em.num(row.get("ic_tstat")) }} | {{ em.num(row.get("rank_autocorr_1")) }} |
  {% endfor %}
  {% if composite %}
  Current library composite (valid, {{ primary_horizon_key }}): {{ em.metrics_line(composite) }}
  {% endif %}
  {% else %}
  The accepted factor library is empty so far: the composite baseline is empty and gate R3/R4 pass automatically. A factor only needs to pass R1 (significance and sign consistency between train and valid) and R2 (coverage) to be accepted.
  {% endif %}

factor_hypothesis_output_format: |-
  The output should follow JSON format. The schema is as follows:
  {
  "hypothesis": "The new hypothesis generated based on the information provided. Limit in two or three sentences.",
  "reason": "The reason why you generate this hypothesis. It should be comprehensive and logical. It should cover the other keys below and extend them. Limit in two or three sentences.",
  }

factor_hypothesis_specification: |-
  1. **1-3 factors per generation:**
    - Each generation produces 1 to 3 factors that test ONE clear idea about the 5-15 minute cross-section of crypto instruments.
    - Make full use of all columns ($open $high $low $close $volume $amount $trade_count $taker_buy_volume $taker_buy_amount), not only $close.
  2. **Simple microstructure factors first:**
    - Start with simple, cheap, easily verified factors: short-horizon reversal and momentum (1-48 bars), taker-buy imbalance ($taker_buy_volume / $volume, $taker_buy_amount / $amount), volume or amount shocks versus a rolling mean, realized volatility over a window of bars, range / ATR-normalised moves, returns relative to BTCUSDT, average trade size ($amount / $trade_count) and UTC-hour seasonality effects.
    - Concisely explain why each factor should rank forward returns and whether you expect a positive or negative sign.
  3. **Gradual complexity increase:**
    - Only after simple factors are tested, introduce interactions (e.g. imbalance conditioned on volatility regime, momentum conditioned on volume shock) and regime-conditioned factors.
    - Combine ideas only after the single ideas have been evaluated.
  4. **Hard constraints of the evaluation:**
    - Use only past bars: the value at bar t may depend on rows with datetime <= t only. No centered windows, no negative shifts, no full-sample statistics (a z-score over the whole history, a rank over all dates), no future information of any kind. Look-ahead factors are detected by re-running the code on a truncated panel and rejected (gate R0).
    - Prefer low turnover: factors with a high rank_autocorr_1 (slowly changing rankings) survive the fee model; noisy bar-to-bar signals do not. Smoothing (EWM, rolling means) over a few bars is encouraged.
    - Factors must be significant on the valid segment (Newey-West |ic_tstat| >= gate_min_tstat, consistent sign with train, and the within-instrument time-varying part must be significant too: a static per-instrument ranking does not pass), cover at least half of the universe and have |correlation| < gate_max_corr with every accepted factor.
  5. **New directions and optimizations:**
    - If several consecutive rounds fail the gate, switch to a genuinely different data column or mechanism instead of tuning window lengths.
    - If optimizing an accepted direction, change the mechanism (normalisation, conditioning) rather than only the window.
  6. Note
    - Accepted factors are already in the library and are used by the composite every round; do not re-implement them.
    - No matter how many factors you plan to generate, only reply with one set of hypothesis and reason. The hypothesis can include the proposal of multiple factors at the same time.

factor_experiment_output_format: |-
  The output should follow JSON format. The schema is as follows:
  {
      "factor name 1": {
          "description": "description of factor 1, start with its type, e.g. [Reversal Factor]",
          "formulation": "latex formulation of factor 1",
          "variables": {
              "variable or function name 1": "description of variable or function 1",
              "variable or function name 2": "description of variable or function 2"
          }
      },
      "factor name 2": {
          "description": "description of factor 2, start with its type, e.g. [Order Flow Imbalance Factor]",
          "formulation": "latex formulation of factor 2",
          "variables": {
              "variable or function name 1": "description of variable or function 1",
              "variable or function name 2": "description of variable or function 2"
          }
      }
      # Don't add ellipsis (...) or any filler text that might cause JSON parsing errors here!
  }
  Factor names must be valid python identifiers (letters, digits, underscores; no spaces), must not repeat a name already in the accepted library, and all window lengths must be stated in bars.

factor_feedback_generation:
  system: |-
    You are a professional crypto microstructure research assistant in a data-driven R&D loop.
    The task is described in the following scenario:

    {{ scenario }}

    You will receive a hypothesis, the factors implemented for it, their RankIC evaluation on the train and valid
    segments, and the outcome of the deterministic acceptance gate for every factor.
    Your feedback should specify whether the current result supports or refutes the hypothesis, explain which gate
    rules failed and why (look-ahead, noise, high turnover, redundancy with the library, low coverage), and suggest
    improvements or new directions.

    Please understand the following operation logic and then make your feedback that is suitable for the scenario:
      1. Logic Explanation:
        a) Factors that passed the gate were added to the accepted factor library; they are used by the rank composite
           in every later round.
        b) New experiments generate new factors, which are scored individually and as an addition to the composite.
        c) The acceptance decision is made by the deterministic gate rules, NOT by you. Do not argue for or against
           acceptance; explain the numbers and propose what to try next.
      2. Development Directions:
        a) New Direction: propose a new factor mechanism or data column for exploration.
        b) Optimization of Existing Direction: suggest a concrete change (normalisation, smoothing, conditioning,
           window in bars) that addresses the failed gate rule. Avoid re-implementing accepted factors.
      3. Final Goal: continuously accumulate low-correlation, low-turnover factors that improve the valid composite.

    Respond in JSON format. Example JSON structure for Result Analysis:
    {
      "Observations": "Your overall observations here (exact numbers, train vs valid consistency, turnover, coverage)",
      "Feedback for Hypothesis": "Observations related to the hypothesis: supported, refuted or inconclusive and why",
      "New Hypothesis": "Your new hypothesis here (two or three sentences, concrete windows in bars and columns)",
      "Reasoning": "Reasoning for the new hypothesis"
    }
  user: |-
    {% import "scenarios.crypto.prompts:crypto_eval_macros" as em %}
    Target hypothesis:
    {{ hypothesis_text }}
    Tasks and Factors:
    {% for task in task_details %}
      - {{ task.factor_name }}: {{ task.factor_description }}
        - Factor Formulation: {{ task.factor_formulation }}
        - Variables: {{ task.variables }}
        - Factor Implementation: {{ task.factor_implementation }}
        {% if task.factor_implementation == "False" %}
        **Note: This factor was not implemented in the current experiment. Only the hypothesis for implemented factors can be verified.**
        {% endif %}
    {% endfor %}
    Gate outcome per factor (deterministic, final):
    {{ gate_summary }}

    {{ em.eval_block(crypto_eval) }}

    {% if summary_text %}
    Evaluation summary log:
    {{ summary_text }}
    {% endif %}

    Analyze the results in the context of their ability to:
    1. Support or refute the hypothesis.
    2. Improve the library composite on the valid segment compared with the composite before this experiment.
    3. Suggest the next factor idea that is most likely to pass the gate rules.

    Note: only factors with 'Factor Implementation' as True are implemented and tested in this experiment. If 'Factor Implementation' is False, the hypothesis for that factor cannot be verified in this run.
